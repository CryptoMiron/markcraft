[package]
name = "markcraft"
version = "0.1.0"
edition = "2024"
description = "Markdown editor for Omarchy"
license = "MIT"

[dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1.1"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
