<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>MarkCraft</title>
    <style>
      /* Типографика — числа из docs/TYPOGRAPHY.md, снятые с Inkdown.
   Меняешь число — приложи скриншот до/после при 100% масштабе. */

:root {
  color-scheme: light dark;
  --mc-bg: #ffffff;
  --mc-fg: rgba(45, 45, 40, 1);
  --mc-muted: #6b6b66;
  --mc-border: rgba(45, 45, 40, 0.2);
  --mc-code-bg: #2a2929;
  --mc-code-fg: #e8e8e3;
  --mc-inline-bg: rgba(23, 23, 23, 0.07);
  --mc-inline-fg: #0f766e;
  --mc-accent: #0f766e;
}

@media (prefers-color-scheme: dark) {
  :root {
    --mc-bg: #1a1b1b;
    --mc-fg: rgba(255, 255, 255, 0.93);
    --mc-muted: rgba(255, 255, 255, 0.55);
    --mc-border: rgba(255, 255, 255, 0.2);
    --mc-code-bg: #1c1c1c;
    --mc-code-fg: #e8e8e3;
    --mc-inline-bg: rgba(255, 255, 255, 0.05);
    --mc-inline-fg: #fb923c;
    --mc-accent: #7dd3fc;
  }
}

html,
body {
  height: 100%;
  margin: 0;
  background: var(--mc-bg);
  color: var(--mc-fg);
}

#editor {
  height: 100%;
}

.cm-editor {
  height: 100%;
  background: transparent;
}

.cm-editor.cm-focused {
  outline: none;
}

.cm-editor .cm-scroller {
  font-family: system-ui, -apple-system, 'Adwaita Sans', sans-serif;
  font-size: 16px;
  line-height: 1.53;
  color: var(--mc-fg);
}

/* Колонка: 796 px минус 48 px поля с каждой стороны = 700 px текста. */
.cm-editor .cm-scroller {
  justify-content: center;
}

.cm-editor .cm-content {
  max-width: 700px;
  width: 100%;
  margin: 0 auto;
  padding: 5vh 0 360px;
  caret-color: var(--mc-fg);
}

.cm-editor .cm-line {
  padding: 3px 0;
}

/* ─── Заголовки ─────────────────────────────────────────────────────────── */
.cm-line.mc-h1 {
  font-size: 1.875em;
  font-weight: 700;
  line-height: 1.3;
  padding-top: 1.2em;
  padding-bottom: 3px;
}
.cm-line.mc-h2 {
  font-size: 1.5em;
  font-weight: 600;
  line-height: 1.3;
  padding-top: 1em;
  padding-bottom: 3px;
}
.cm-line.mc-h3 {
  font-size: 1.4em;
  font-weight: 600;
  line-height: 1.3;
  padding-top: 0.8em;
  padding-bottom: 3px;
}
.cm-line.mc-h4 {
  font-size: 1.3em;
  font-weight: 500;
  line-height: 1.2;
  padding-top: 0.7em;
  padding-bottom: 3px;
}
.cm-line.mc-h5,
.cm-line.mc-h6 {
  font-size: 1em;
  font-weight: 600;
  padding-top: 0.7em;
  padding-bottom: 3px;
}

/* Первый заголовок документа не отлепляется от верха. */
.cm-line.mc-h1:first-child,
.cm-line.mc-h2:first-child,
.cm-line.mc-h3:first-child {
  padding-top: 0;
}

/* ─── Инлайн ────────────────────────────────────────────────────────────── */
.mc-strong {
  font-weight: 700;
}
.mc-em {
  font-style: italic;
}
.mc-strike {
  text-decoration: line-through;
}
.mc-code-inline {
  font-family: ui-monospace, 'JetBrains Mono', 'IBM Plex Mono', monospace;
  font-size: 0.85em;
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--mc-inline-bg);
  color: var(--mc-inline-fg);
  word-break: break-word;
}

/* ─── Цитата ────────────────────────────────────────────────────────────── */
/* Полоса — border-left: он тянется на всю высоту строки. Вертикальные отступы
   у строк цитаты убраны, иначе полоса рвётся между строками. */
.cm-line.mc-quote {
  font-style: italic;
  font-size: 0.96em;
  color: var(--mc-muted);
  padding-top: 0;
  padding-bottom: 0;
  border-left: 4px solid var(--mc-border);
  padding-left: 17px;
}

/* ─── Код ───────────────────────────────────────────────────────────────── */
.cm-line.mc-code {
  font-family: ui-monospace, 'JetBrains Mono', 'IBM Plex Mono', monospace;
  font-size: 0.875em;
  background: var(--mc-code-bg);
  color: var(--mc-code-fg);
  padding-left: 16px;
  padding-right: 16px;
}

/* ─── Списки и задачи ───────────────────────────────────────────────────── */
.mc-bullet {
  color: var(--mc-muted);
}

.mc-task {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1em;
  height: 1em;
  margin-right: 0.4em;
  border: 1px solid var(--mc-border);
  border-radius: 3px;
  font-size: 0.8em;
  line-height: 1;
  vertical-align: -0.1em;
  color: var(--mc-accent);
}
.mc-task-done {
  border-color: var(--mc-accent);
}

/* ─── Таблицы ───────────────────────────────────────────────────────────── */
.mc-table {
  border-collapse: collapse;
  font-size: 0.9em;
  margin: 3px 0 15px;
}
.mc-table th,
.mc-table td {
  border: 1px solid var(--mc-border);
  padding: 0.375em 1em 0.375em 0.75em;
  line-height: 1.7;
  vertical-align: top;
}
.mc-table th {
  font-weight: 700;
  background: rgba(128, 128, 128, 0.12);
}

/* ─── Прочее ────────────────────────────────────────────────────────────── */
.mc-img {
  max-width: 100%;
  border-radius: 4px;
  vertical-align: top;
}
.mc-img-missing {
  display: inline-block;
  padding: 0.2em 0.6em;
  border: 1px dashed var(--mc-border);
  border-radius: 4px;
  color: var(--mc-muted);
  font-size: 0.9em;
}
.mc-link {
  color: var(--mc-accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

.cm-line:has(.mc-table),
.cm-line:has(.mc-hr) {
  padding: 0;
}

.mc-hr {
  border: 0;
  border-top: 1px solid var(--mc-border);
  margin: 2em 0;
}

/* ─── Скрытая разметка ──────────────────────────────────────────────────── */
/* Заменённый маркер не должен оставлять дырки в строке. */
.cm-widgetBuffer {
  display: none;
}

.cm-placeholder {
  color: var(--mc-muted);
  font-style: normal;
}

::selection {
  background: rgba(128, 128, 128, 0.3);
}
